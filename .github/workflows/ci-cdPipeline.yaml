name: Pipeline

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

        #=================================
        #   Backend
        #=================================

      - name: Build Backend
        working-directory: backend
        run: npm run build

        #=================================
        #   Frontend
        #=================================

      - name: Install Frontend Dependencies
        working-directory: frontend/bddTrainTwo
        run: npm ci

      - name: Build Frontend
        working-directory: frontend/bddTrainTwo
        run: npm run build

      - name: Install dependencies
        working-directory: BDD
        run: npm install


      - name: run BDD Test 
        working-directory: BDD
        run: npm run test:bdd
        #=================================
        #   final
        #=================================

      - name: List Files
        run: ls -la

      - name: Pipeline Completed
        run: echo "✅ Pipeline completed successfully!"
